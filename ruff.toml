line-length = 88
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "BLE"]

[lint.per-file-ignores]
"scripts/build_fonts.py" = ["S310"]  # downloads fonts from a fixed https URL
"profile_kit/github_api.py" = ["S310"]  # only calls the fixed https GitHub API
"profile_kit/hero.py" = ["S311"]  # decorative star/scramble randomness, not security
